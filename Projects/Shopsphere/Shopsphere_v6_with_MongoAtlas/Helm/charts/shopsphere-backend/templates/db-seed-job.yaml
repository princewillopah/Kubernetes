apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: db-seed   # ← THIS LABEL IS REQUIRED because of the NetworkPolicy
    spec:
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-mongo
          image: busybox:1.28
          command:
            - sh
            - -c
            - |
              until nc -z mongo 27017; do
                echo "waiting for mongo";
                sleep 3;
              done;

      containers:
        - name: seed
          image: {{ .Values.backend.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting DB seed..."
              sleep 3
              echo "Starting seed script..."
              npm run seed
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.backend.secretName }}
                  key: {{ .Values.secrets.backend.mongoUriSecretKey }}

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.backend.secretName }}
                  key: {{ .Values.secrets.backend.jwtTokenSecretKey }}

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: node-env

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
