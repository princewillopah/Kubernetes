apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: shopsphere
spec:
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
    ports:
    - protocol: TCP
      port: 5000   # backend
    - protocol: TCP
      port: 9113   # nginx exporter
    - protocol: TCP
      port: 9216   # mongo exporter




