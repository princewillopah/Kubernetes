apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
      - name: notification-service
        image: princewillopah2/taskflow-micro-services-notification-service:1.0.0
        ports: [{ containerPort: 3003 }]
        env:
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: taskflow-app-credentials
              key: RABBITMQ_URL_LINK
        - name: REDIS_HOST
          value: "redis"
        readinessProbe:
          tcpSocket: { port: 3003 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 3003 }
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector: { app: notification-service }
  ports: [{ port: 3003, targetPort: 3003 }]
  type: ClusterIP
