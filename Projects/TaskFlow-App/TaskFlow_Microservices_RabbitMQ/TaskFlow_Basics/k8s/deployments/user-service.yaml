apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
      - name: user-service
        image: princewillopah2/taskflow-micro-services-user-service:1.0.0
        ports: [{ containerPort: 3002 }]
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: taskflow-app-credentials
              key: MONGO_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: taskflow-app-credentials
              key: JWT_SECRET
        readinessProbe:
          tcpSocket: { port: 3002 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 3002 }
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector: { app: user-service }
  ports: [{ port: 3002, targetPort: 3002 }]
  type: ClusterIP
