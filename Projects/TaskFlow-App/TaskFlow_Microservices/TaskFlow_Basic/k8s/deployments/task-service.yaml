apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: task-service }
  template:
    metadata:
      labels: { app: task-service }
    spec:
      containers:
      - name: task-service
        image: princewillopah2/taskflow-microservices-task-service:1.0.0
        ports: [{ containerPort: 3001 }]
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: taskflow-app-credentials
              key: MONGO_URI
        - name: REDIS_HOST
          value: "redis"
        readinessProbe:
          tcpSocket: { port: 3001 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 3001 }
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
spec:
  selector: { app: task-service }
  ports: [{ port: 3001, targetPort: 3001 }]
  type: ClusterIP
