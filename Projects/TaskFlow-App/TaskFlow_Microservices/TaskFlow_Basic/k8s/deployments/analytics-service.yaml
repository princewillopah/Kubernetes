apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
spec:
  replicas: 2
  selector:
    matchLabels: { app: analytics-service }
  template:
    metadata:
      labels: { app: analytics-service }
    spec:
      containers:
      - name: analytics-service
        image: princewillopah2/taskflow-microservices-analytics-service:1.0.0
        ports: [{ containerPort: 3004 }]
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: taskflow-app-credentials
              key: MONGO_URI
        readinessProbe:
          tcpSocket: { port: 3004 }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket: { port: 3004 }
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
spec:
  selector: { app: analytics-service }
  ports: [{ port: 3004, targetPort: 3004 }]
  type: ClusterIP
