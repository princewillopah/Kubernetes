apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace:  {{ .Release.Namespace }}
spec:
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
    ports:
    - protocol: TCP
      port: {{ .Values.backend.ports }}   # backend
    - protocol: TCP
      port: {{ .Values.node-exporter.ports }}   # nginx exporter
    - protocol: TCP
      port: {{ .Values.mongo-exporter.ports }}   # mongo exporter




