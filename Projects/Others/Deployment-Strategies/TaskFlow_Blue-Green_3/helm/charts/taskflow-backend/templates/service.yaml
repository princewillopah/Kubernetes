apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
    release: blue
  ports:
    - name: http                                   
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}



