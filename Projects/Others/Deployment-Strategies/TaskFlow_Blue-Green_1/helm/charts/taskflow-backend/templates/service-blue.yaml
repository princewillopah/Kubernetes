apiVersion: v1
kind: Service
metadata:
  name: backend-blue
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
    color: blue
spec:
  type: ClusterIP
  selector:
    app: backend
    color: blue
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}