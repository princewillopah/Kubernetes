apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: ecommerce
  POSTGRES_PASSWORD: ecommerce123
  POSTGRES_DB: ecommerce
  DATABASE_URL: postgresql://ecommerce:ecommerce123@postgres:5432/ecommerce

  # JWT Secret (CHANGE THIS IN PRODUCTION!)
  JWT_SECRET: your-secret-key-change-in-production-use-openssl-rand-base64-32

  # Redis URL
  REDIS_URL: redis://redis:6379

  # RabbitMQ URL
  RABBITMQ_URL: amqp://ecommerce:ecommerce123@rabbitmq:5672

  # Elasticsearch URL
  ELASTICSEARCH_URL: http://elasticsearch:9200
