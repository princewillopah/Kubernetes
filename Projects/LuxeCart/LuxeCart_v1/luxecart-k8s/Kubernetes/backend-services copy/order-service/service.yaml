apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: luxe-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3005"
    prometheus.io/path: "/metrics"
  labels:
    app: order-service
    tier: business-logic
spec:
  selector:
    app: order-service
  ports:
  - port: 3005
    targetPort: 3005
  type: ClusterIP