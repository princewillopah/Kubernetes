apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: luxe-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
  labels:
    app: api-gateway-service
    tier: gateway
spec:
  selector:
    app: api-gateway-service
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP