apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: luxe-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3009"
    prometheus.io/path: "/metrics"
  labels:
    app: notification-service
    tier: business-logic
spec:
  selector:
    app: notification-service
  ports:
  - port: 3009
    targetPort: 3009
  type: ClusterIP