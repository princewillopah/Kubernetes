apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: luxe-infra
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9121"
    prometheus.io/path: "/metrics"
  labels:
    app: redis-exporter
    tier: monitoring
spec:
  selector:
    app: redis-exporter
  ports:
    - port: 9121
      targetPort: 9121