apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: luxe-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: princewillopah2/luxecart-order-service:1.0.5
        imagePullPolicy: Always
        ports:
        - containerPort: 3005
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: luxecart-auth-secrets
              key: DATABASE_URL
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: luxecart-auth-secrets
              key: RABBITMQ_URL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 25
          failureThreshold: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 25
          failureThreshold: 15

