apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: luxe-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3003"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: product-service
  ports:
  - port: 3003
    targetPort: 3003
  type: ClusterIP