apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: luxe-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3014"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: inventory-service
  ports:
  - port: 3011
    targetPort: 3011
  type: ClusterIP