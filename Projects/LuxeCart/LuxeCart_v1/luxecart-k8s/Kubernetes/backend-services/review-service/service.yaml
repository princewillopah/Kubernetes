apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: luxe-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3006"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: review-service
  ports:
  - port: 3006
    targetPort: 3006
  type: ClusterIP