apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: luxe-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3012"
    prometheus.io/path: "/metrics"
  labels:
    app: search-service
    tier: business-logic
spec:
  selector:
    app: search-service
  ports:
  - port: 3012
    targetPort: 3012
  type: ClusterIP