apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: luxe-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3010"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: admin-service
  ports:
  - port: 3010
    targetPort: 3010
  type: ClusterIP