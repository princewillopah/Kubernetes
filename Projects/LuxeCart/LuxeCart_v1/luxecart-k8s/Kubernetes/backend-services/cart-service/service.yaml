apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: luxe-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3002"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: cart-service
  ports:
  - port: 3004
    targetPort: 3004
  type: ClusterIP