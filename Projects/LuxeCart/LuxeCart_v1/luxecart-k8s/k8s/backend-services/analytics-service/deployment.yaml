apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: luxe-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: princewillopah2/luxecart-analytics-service:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3013
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: luxecart-auth-secrets
              key: DATABASE_URL

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 3013
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3013
          initialDelaySeconds: 20
          periodSeconds: 10

