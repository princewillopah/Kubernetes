apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  namespace: luxe-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-service
  template:
    metadata:
      labels:
        app: email-service
    spec:
      containers:
      - name: email-service
        image: princewillopah2/luxecart-email-service:1.0.4
        imagePullPolicy: Always
        ports:
        - containerPort: 3015
        env:
        - name: PORT
          value: "3015"
        - name: SMTP_HOST
          value: "smtp.gmail.com"
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: luxecart-auth-secrets
              key: SMTP_USER
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: luxecart-auth-secrets
              key: SMTP_PASSWORD
        - name: FROM_EMAIL
          valueFrom:
            secretKeyRef:
              name: luxecart-auth-secrets
              key: FROM_EMAIL
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: luxecart-auth-secrets
              key: MONGODB_URL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: luxecart-auth-secrets
              key: DATABASE_URL
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: luxecart-auth-secrets
              key: RABBITMQ_URL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 3015
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 25
          failureThreshold: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 3015
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 25
          failureThreshold: 15

