apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: luxe-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
      - name: recommendation-service
        image: princewillopah2/luxecart-recommendation-service:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3014
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: luxecart-auth-secrets
              key: DATABASE_URL
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: luxecart-auth-secrets
              key: RABBITMQ_URL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 3014
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3014
          initialDelaySeconds: 20
          periodSeconds: 10

